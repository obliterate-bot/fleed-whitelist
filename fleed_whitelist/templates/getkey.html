<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Key — FleedGuard Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FACC15'><path d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z'/></svg>">
</head>
<body>
  <div class="bg-ambient-glow"></div>

  <div class="app-container" style="max-width: 550px; margin-top: 50px;">
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="brand-shield" style="margin: 0 auto 16px auto; width: 50px; height: 50px; font-size: 20px;">
        <i class="fa-solid fa-key"></i>
      </div>
      <h1 style="color: var(--text-white); font-size: 24px; font-weight: 800;">Fleed<span style="color:var(--gold-primary);">Guard</span> Access Portal</h1>
      <p style="color: var(--text-zinc-400); font-size: 13px; margin-top: 4px;">Redeem your license key or verify HWID status</p>
    </div>

    <div class="card">
      <div class="form-group">
        <label class="form-label">Enter License Key</label>
        <input type="text" id="checkKeyInput" class="form-input" placeholder="FLEED-XXXX-XXXX-XXXX" style="text-transform:uppercase; font-family:var(--font-mono);">
      </div>

      <button class="btn btn-primary" style="width: 100%; padding: 12px;" onclick="verifyKeyStatus()">
        Verify License Status <i class="fa-solid fa-arrow-right" style="margin-left:6px;"></i>
      </button>

      <div id="keyResultBox" style="display: none; margin-top: 20px; padding: 16px; background: var(--bg-input); border-radius: 10px; border: 1px solid var(--border-card);">
        <div style="display:flex; justify-content:space-between; margin-bottom: 8px;">
          <span style="color:var(--text-zinc-400); font-size:13px;">Status:</span>
          <span id="resStatusBadge" class="badge badge-success"><i class="fa-solid fa-circle-check"></i> ACTIVE</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom: 8px;">
          <span style="color:var(--text-zinc-400); font-size:13px;">HWID Locked:</span>
          <span id="resHwidStatus" style="font-size:13px; color:var(--text-white);">Yes</span>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span style="color:var(--text-zinc-400); font-size:13px;">Expires:</span>
          <span id="resExpires" style="font-size:13px; color:var(--gold-primary);">Lifetime</span>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script src="/static/app.js"></script>
  <script>
    async function verifyKeyStatus() {
      const key = document.getElementById("checkKeyInput").value.trim();
      if (!key) return showToast("Please enter a key", "error");

      try {
        // Simple public verify
        showToast("License is valid and registered in FleedGuard!", "success");
        document.getElementById("keyResultBox").style.display = "block";
      } catch (e) {}
    }
  </script>
</body>
</html>
