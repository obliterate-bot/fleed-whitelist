<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buyer Portal & Key Redemption — FleedGuard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FACC15'><path d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z'/></svg>">
  <style>
    :root {
      --bg-deep: #09090b;
      --bg-surface: #121215;
      --bg-card: rgba(24, 24, 27, 0.75);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-gold: rgba(250, 204, 21, 0.35);
      --gold-primary: #FACC15;
      --gold-hover: #EAB308;
      --text-white: #FFFFFF;
      --text-zinc-400: #A1A1AA;
      --text-zinc-500: #71717A;
      --success-green: #22C55E;
      --danger-red: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg-deep);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    .bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(250, 204, 21, 0.07) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }
    .portal-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(250, 204, 21, 0.2), rgba(250, 204, 21, 0.05));
      border: 1px solid var(--border-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: var(--gold-primary);
      margin-bottom: 14px;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .brand-subtitle {
      font-size: 13px;
      color: var(--text-zinc-400);
      margin-top: 4px;
    }
    .input-group {
      margin-bottom: 18px;
    }
    .input-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-zinc-400);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-field {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      color: var(--text-white);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .input-field:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.2);
    }
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: var(--gold-primary);
      color: #000;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn-submit:hover {
      background: var(--gold-hover);
      transform: translateY(-1px);
    }
    .result-box {
      display: none;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border-subtle);
      animation: fadeIn 0.3s ease;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .info-label { color: var(--text-zinc-500); }
    .info-val { font-weight: 600; }
    .badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-green { background: rgba(34, 197, 94, 0.15); color: var(--success-green); border: 1px solid rgba(34, 197, 94, 0.3); }
    .badge-gold { background: rgba(250, 204, 21, 0.15); color: var(--gold-primary); border: 1px solid var(--border-gold); }
    .code-container {
      margin-top: 16px;
      background: rgba(0,0,0,0.6);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 12px;
      position: relative;
    }
    .code-box {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #93C5FD;
      word-break: break-all;
      white-space: pre-wrap;
      max-height: 120px;
      overflow-y: auto;
    }
    .btn-copy {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-subtle);
      color: var(--text-white);
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-copy:hover { background: rgba(255, 255, 255, 0.2); }
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    .btn-secondary {
      padding: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-white);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.12); }
    .error-msg {
      display: none;
      margin-top: 14px;
      padding: 12px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #FCA5A5;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      background: #18181B;
      border: 1px solid var(--border-gold);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 99;
      animation: popIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="portal-card">
    <div class="brand-header">
      <div class="brand-icon">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1 class="brand-title">Fleed<span style="color:var(--gold-primary);">Guard</span> Buyer Portal</h1>
      <p class="brand-subtitle">Redeem license key, get custom loadstring & manage HWID</p>
    </div>

    <form id="redeemForm" onsubmit="handleRedeem(event)">
      <div class="input-group">
        <label class="input-label" for="keyInput">License Key</label>
        <input class="input-field" type="text" id="keyInput" placeholder="FLEED-XXXX-XXXX-XXXX" required autocomplete="off" spellcheck="false">
      </div>

      <div class="input-group">
        <label class="input-label" for="discordInput">Discord User ID (Optional)</label>
        <input class="input-field" type="text" id="discordInput" placeholder="e.g. 123456789012345678" autocomplete="off">
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <i class="fa-solid fa-bolt"></i> Verify & Get Loadstring
      </button>
    </form>

    <div id="errorBox" class="error-msg"></div>

    <div id="resultBox" class="result-box">
      <div class="info-row">
        <span class="info-label">Script Hub</span>
        <span class="info-val" id="resScript">Golden Eagle</span>
      </div>
      <div class="info-row">
        <span class="info-label">License Status</span>
        <span class="badge badge-green" id="resStatus">Active</span>
      </div>
      <div class="info-row">
        <span class="info-label">Hardware Lock</span>
        <span class="badge badge-gold" id="resHwid">Unbound</span>
      </div>
      <div class="info-row">
        <span class="info-label">Access Duration</span>
        <span class="info-val" id="resExpires">Lifetime</span>
      </div>

      <div class="code-container">
        <button class="btn-copy" onclick="copyLoadstring()">
          <i class="fa-solid fa-copy"></i> Copy
        </button>
        <div class="code-box" id="resCode">-- Loading script loader...</div>
      </div>

      <div class="actions-grid">
        <button class="btn-secondary" onclick="handleResetHwid()">
          <i class="fa-solid fa-arrows-rotate"></i> Reset HWID Lock
        </button>
        <button class="btn-secondary" onclick="window.location.reload()">
          <i class="fa-solid fa-key"></i> New Key
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">
    <i class="fa-solid fa-circle-check" style="color:var(--gold-primary);"></i>
    <span id="toastMsg">Loadstring copied to clipboard!</span>
  </div>

  <script>
    let currentLoadstring = "";
    let currentKey = "";
    let currentDiscord = "";

    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toastMsg").innerText = msg;
      toast.style.display = "flex";
      setTimeout(() => { toast.style.display = "none"; }, 3000);
    }

    async function handleRedeem(e) {
      e.preventDefault();
      const key = document.getElementById("keyInput").value.trim();
      const discord_id = document.getElementById("discordInput").value.trim();
      const errBox = document.getElementById("errorBox");
      const resBox = document.getElementById("resultBox");
      const btn = document.getElementById("submitBtn");

      errBox.style.display = "none";
      resBox.style.display = "none";
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Verifying...';
      btn.disabled = true;

      try {
        const resp = await fetch("/api/public/redeem", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ license_key: key, discord_id: discord_id || null })
        });
        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.detail || "Invalid license key.");
        }

        currentKey = data.license_key;
        currentDiscord = data.discord_id || discord_id;
        currentLoadstring = data.loadstring;

        document.getElementById("resScript").innerText = data.script_name;
        document.getElementById("resHwid").innerText = data.is_hwid_bound ? "HWID Bound (PC Locked)" : "Unbound (First Device Claims)";
        document.getElementById("resExpires").innerText = data.expires_at;
        document.getElementById("resCode").innerText = data.loadstring;
        resBox.style.display = "block";
      } catch (err) {
        errBox.innerText = err.message;
        errBox.style.display = "block";
      } finally {
        btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Verify & Get Loadstring';
        btn.disabled = false;
      }
    }

    function copyLoadstring() {
      if (!currentLoadstring) return;
      navigator.clipboard.writeText(currentLoadstring).then(() => {
        showToast("Loadstring copied! Paste into your Roblox executor.");
      });
    }

    async function handleResetHwid() {
      if (!currentKey) return;
      if (!currentDiscord) {
        const disc = prompt("Please enter your linked Discord ID to confirm HWID reset:");
        if (!disc) return;
        currentDiscord = disc.trim();
      }

      if (!confirm("Are you sure you want to reset your device lock? You can then run on your new PC.")) return;

      try {
        const resp = await fetch("/api/public/resethwid", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ license_key: currentKey, discord_id: currentDiscord })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || "Failed to reset HWID");
        showToast(data.message || "HWID successfully reset!");
        document.getElementById("resHwid").innerText = "Unbound (Reset Successful)";
      } catch (err) {
        alert("Error: " + err.message);
      }
    }
  </script>
</body>
</html>
