<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FleedGuard — Uncrackable Whitelist & Security Service</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FACC15'><path d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z'/></svg>">
</head>
<body>
  <div class="bg-ambient-glow"></div>

  <div class="app-container" style="max-width: 500px; margin-top: 60px;">
    <!-- Brand Header -->
    <div style="text-align: center; margin-bottom: 36px;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark)); border-radius: 16px; box-shadow: 0 0 30px var(--gold-glow); margin-bottom: 16px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#050505"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
      </div>
      <h1 style="color: var(--text-white); font-size: 28px; font-weight: 800; letter-spacing: -0.5px;">Fleed<span style="color:var(--gold-primary);">Guard</span></h1>
      <p style="color: var(--text-zinc-400); font-size: 14px; margin-top: 6px;">Next-Gen Anti-Crack Whitelisting & 2FA Protection</p>
    </div>

    <!-- Auth Card -->
    <div class="card">
      <!-- Auth Switcher -->
      <div class="tabs-nav" style="margin-bottom: 24px;">
        <button class="tab-btn active" id="tabLoginBtn" onclick="showAuthForm('login')">Sign In</button>
        <button class="tab-btn" id="tabRegBtn" onclick="showAuthForm('register')">Create Account</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="loginUsername" class="form-input" placeholder="developer" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••••••" required autocomplete="current-password">
        </div>
        <div class="form-group" id="login2FAGroup" style="display: none;">
          <label class="form-label" style="color:var(--gold-primary);">2FA Authenticator / Backup Code</label>
          <input type="text" id="login2FACode" class="form-input" placeholder="6-digit TOTP or 8-char code" style="border-color:var(--border-gold);" autocomplete="one-time-code">
          <small style="color:var(--text-zinc-500); font-size: 11px; margin-top: 4px; display: block;">Open Google Authenticator or enter a recovery code.</small>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; margin-top: 10px;">
          Authenticate & Access Console →
        </button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" style="display: none;" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="regUsername" class="form-input" placeholder="fleed_dev" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="regEmail" class="form-input" placeholder="dev@fleed.bot" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="regPassword" class="form-input" placeholder="Minimum 6 characters" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; margin-top: 10px;">
          Register Developer Account →
        </button>
      </form>
    </div>

    <!-- Security Highlights -->
    <div style="margin-top: 30px; display: flex; justify-content: space-around; text-align: center; color: var(--text-zinc-500); font-size: 12px;">
      <div>🔐 RFC 6238 2FA</div>
      <div>🛡️ Anti-Hook VM</div>
      <div>⚡ Zero Plaintext</div>
      <div>🔑 HWID Lock</div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="/static/app.js"></script>
  <script>
    function showAuthForm(type) {
      if (type === 'login') {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('tabLoginBtn').classList.add('active');
        document.getElementById('tabRegBtn').classList.remove('active');
      } else {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
        document.getElementById('tabLoginBtn').classList.remove('active');
        document.getElementById('tabRegBtn').classList.add('active');
      }
    }
  </script>
</body>
</html>
