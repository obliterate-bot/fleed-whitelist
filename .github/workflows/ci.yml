name: Deploy FleedGuard 24/7 Whitelist & Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test_and_package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          pytest tests/test_whitelist.py -v
